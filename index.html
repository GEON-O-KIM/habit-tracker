<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>습관 트래커</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#e8eaec" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="습관" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header__top">
        <h1 class="header__title">습관 트래커</h1>
        <p class="header__date" id="todayDate">2026년 1월 1일</p>
      </div>
      <p class="header__summary" id="summary"></p>
    </header>

    <section class="add-form">
      <form id="habitForm">
        <input
          type="text"
          id="habitName"
          class="add-form__input"
          placeholder="습관 이름 (예: 아침 운동)"
          maxlength="30"
          required
        />
        <div class="add-form__row">
          <label class="add-form__label">
            목표
            <input
              type="number"
              id="habitGoal"
              class="add-form__number"
              value="30"
              min="1"
              max="3650"
              required
            />
            일
          </label>
          <button type="submit" class="add-form__submit">추가</button>
        </div>
      </form>
    </section>

    <section class="habits" id="habitList"></section>

    <p class="empty" id="emptyState">첫 습관을 추가하면 여기에 표시됩니다.</p>

    <footer class="footer">
      <button id="resetAll" class="footer__reset">전체 초기화</button>
    </footer>
  </div>

  <div class="pause" id="pauseOverlay" hidden>
    <div
      class="pause__card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="pauseTitle"
    >
      <p class="pause__title" id="pauseTitle">10초 멈춤</p>
      <p class="pause__sub">충동이 지나갈 시간을 둡니다.</p>
      <div class="pause__count"><span id="pauseNum">10</span></div>
      <div class="pause__bar"><i id="pauseBar"></i></div>
      <div class="pause__actions">
        <button type="button" class="pause__stop" id="pauseStop">취소</button>
        <button type="button" class="pause__done" id="pauseDone" disabled>10초</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
